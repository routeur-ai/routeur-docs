post:
  operationId: createChatCompletion
  summary: Create a chat completion
  description: Submit an OpenAI-compatible chat completion request through routeur.ai routing.
  tags: [chat-completions]
  x-stability: Stable
  parameters:
    - in: header
      name: Routeur-Trace
      required: false
      schema:
        x-type: "true | false"
      description: Append a `routeur` metadata block to the response.
    - in: header
      name: Routeur-Dry-Run
      required: false
      schema:
        x-type: "true | false"
      description: Return the route resolution without calling the upstream provider.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required: [model, messages]
          properties:
            model:
              type: string
              description: |
                The model to use. Pass `auto` (or any other alias defined in
                your routing rules) to let routeur.ai pick the upstream model.
                Pass an explicit upstream model id (e.g. `gpt-4o-mini`,
                `claude-3-5-sonnet`) to bypass routing and send the request
                directly to that model.
            messages:
              type: array
              description: Conversation history. Each item has a `role` and `content`.
              items:
                type: object
            temperature:
              type: number
              default: 1
              description: Sampling temperature passed through to the upstream provider.
            stream:
              type: boolean
              default: false
              description: >
                When true, the response is streamed as server-sent events
                (`text/event-stream`): a sequence of `chat.completion.chunk`
                objects terminated by `data: [DONE]`. For organizations with
                output-moderation rules the stream is delivered only after
                moderation completes (see the Streaming section of the guide).
  responses:
    '200':
      description: >
        OK. A single chat completion object when `stream` is false, or an
        SSE `text/event-stream` of `chat.completion.chunk` objects when
        `stream` is true.
      content:
        text/event-stream:
          x-label: Streamed response (stream=true)
          example: |
            data: {"id":"chatcmpl_01J...","object":"chat.completion.chunk","model":"gpt-4o-mini","choices":[{"index":0,"delta":{"role":"assistant"}}]}

            data: {"object":"chat.completion.chunk","choices":[{"index":0,"delta":{"content":"Hello"}}]}

            data: {"object":"chat.completion.chunk","choices":[{"index":0,"delta":{},"finish_reason":"stop"}],"usage":{"prompt_tokens":9,"completion_tokens":2,"total_tokens":11}}

            data: [DONE]
        application/json:
          x-label: Response
          example: |
            {
              "id": "chatcmpl_01J...",
              "object": "chat.completion",
              "model": "gpt-4o-mini",
              "choices": [{
                "index": 0,
                "message": {
                  "role": "assistant",
                  "content": "Hello there!"
                },
                "finish_reason": "stop"
              }],
              "routeur": {
                "provider": "openai",
                "model": "gpt-4o-mini",
                "route_reason": "default",
                "redactions": 1
              }
            }
  x-codeSamples:
    - lang: curl
      source: |
        curl https://api.routeur.ai/v1/chat/completions \
          -H "Authorization: Bearer $ROUTEUR_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "model": "auto",
            "messages": [
              {"role": "user", "content": "Hello"}
            ]
          }'
    - lang: node
      source: |
        import OpenAI from "openai";

        const client = new OpenAI({
          apiKey: process.env.ROUTEUR_KEY,
          baseURL: "https://api.routeur.ai/v1"
        });

        const r = await client.chat.completions.create({
          model: "auto",
          messages: [{ role: "user", content: "Hello" }]
        });
    - lang: python
      source: |
        from openai import OpenAI

        client = OpenAI(
            api_key=os.environ["ROUTEUR_KEY"],
            base_url="https://api.routeur.ai/v1",
        )

        r = client.chat.completions.create(
            model="auto",
            messages=[{"role": "user", "content": "Hello"}],
        )
