name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-and-openapi:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint markdown
        run: npx -y markdownlint-cli2 "content/**/*.md" "docs/**/*.md" "*.md"

      - name: Lint OpenAPI
        run: npx -y @stoplight/spectral-cli lint openapi/openapi.yaml

  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-loopback
            --root-dir content
            --fallback-extensions md
            "content/**/*.md"
            "docs/**/*.md"
            "*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
