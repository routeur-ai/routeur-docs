name: Documentation request
description: Propose a new page, example, clarification, or guide
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for gaps in the docs, not product feature requests.
  - type: input
    id: topic
    attributes:
      label: Topic
      description: Name the missing page, example, or clarification you want.
      placeholder: Add a TypeScript quickstart for responses API
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What is missing or unclear?
      description: Describe the missing detail or confusing part of the current docs.
      placeholder: There is no page that explains...
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Who is this for?
      description: Describe the user or workflow that needs this documentation.
      placeholder: New users migrating from the OpenAI API
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: Suggest the page, example, or wording you would like to see.
      placeholder: Add a short guide with curl, JavaScript, and Python examples.